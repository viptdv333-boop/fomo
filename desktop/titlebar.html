<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'">
<style>
html,body { margin:0; background:#f0f2f7; }
header { height:36px; display:flex; align-items:center; padding:0 150px 0 14px; box-sizing:border-box; -webkit-app-region:drag; user-select:none; }
.brand { display:inline-flex; font:900 22px/1 Arial,Helvetica,sans-serif; letter-spacing:-1.2px; }
.brand span { color:#00ac55; }
.brand span:nth-child(odd) { color:#eb414c; }
</style>
</head>
<body><header><div class="brand" role="img" aria-label="FOMO"><span>F</span><span>O</span><span>M</span><span>O</span></div></header></body>
</html>
