<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMO</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0a0a0a; color: #e5e5e5; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 20px; color: #9ca3af; }
  button { font: inherit; font-weight: 600; padding: 10px 28px; border-radius: 10px; border: 0; background: #fff; color: #000; cursor: pointer; }
  button:hover { background: #d4d4d4; }
  button:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; }
  .ico { width: 48px; height: 48px; margin: 0 auto 16px; color: #6b7280; }
</style>
</head>
<body>
<div class="box">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  <h1 id="h">Нет соединения с fomo.spot</h1>
  <p id="p">Проверьте интернет и попробуйте ещё раз.</p>
  <button id="retry" type="button">Повторить</button>
</div>
<script>
  var en = !/^ru/i.test(navigator.language || "ru");
  if (en) {
    document.documentElement.lang = "en";
    document.getElementById("h").textContent = "Can't reach fomo.spot";
    document.getElementById("p").textContent = "Check your internet connection and try again.";
    document.getElementById("retry").textContent = "Retry";
  }
  document.getElementById("retry").addEventListener("click", function () {
    // the app only lets https://fomo.spot (and this page) be opened in the window
    location.href = "https://fomo.spot/";
  });
</script>
</body>
</html>
