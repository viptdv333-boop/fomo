# Project-wide Gradle settings (same style as the other projects in AndroidStudioProjects).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optional overrides (put them in ~/.gradle/gradle.properties or pass with -P, do not commit secrets):
#   fomo.debugBaseUrl=https://staging.example.com   -> the DEBUG build loads this https origin instead of https://fomo.spot
#   fomo.keystore=C:/path/fomo-release.jks, fomo.keystorePassword=..., fomo.keyAlias=..., fomo.keyPassword=...
#       -> sign assembleRelease locally (CI uses the ANDROID_KEYSTORE_* secrets instead)
