name: Android APK

# Builds the Android app (android/) so an APK can be downloaded from the Actions tab:
#   Actions -> "Android APK" -> a run -> Artifacts.
# Run it by hand (Run workflow) or by pushing a change under android/.
# A tag named android-v<version> (e.g. android-v1.0.1) also publishes the signed APK as a GitHub Release asset.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to attach the APK to a release on android-v* tags
    defaults:
      run:
        working-directory: android
    env:
      # Secrets cannot be tested in `if:` directly, so expose "is it set" as plain strings.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_GOOGLE_SERVICES_TERMINAL: ${{ secrets.GOOGLE_SERVICES_TERMINAL_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the SDK command-line tools and accepts the licences so Gradle can fetch platform 36 if the image lacks it.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # Optional: use another Firebase client config than the one committed in android/app/src/fomo/google-services.json.
      - name: Firebase config from secret (optional)
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/src/fomo/google-services.json

      # Optional: Firebase client config of FOMO Terminal (project terminal-f7486, package spot.fomo.terminal).
      # Without it (and without a committed android/app/src/terminal/google-services.json) FOMO Terminal is built without push.
      - name: Firebase config of FOMO Terminal from secret (optional)
        if: env.HAS_GOOGLE_SERVICES_TERMINAL == 'true'
        env:
          GOOGLE_SERVICES_TERMINAL_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_TERMINAL_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_TERMINAL_JSON_BASE64" | base64 --decode > app/src/terminal/google-services.json

      - name: Build debug APKs (fomo + terminal)
        run: ./gradlew assembleFomoDebug assembleTerminalDebug --stacktrace

      - name: Upload debug APK (FOMO)
        uses: actions/upload-artifact@v4
        with:
          name: fomo-debug-apk
          path: android/app/build/outputs/named-apk/fomoDebug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK (FOMO Terminal)
        uses: actions/upload-artifact@v4
        with:
          name: fomo-terminal-debug-apk
          path: android/app/build/outputs/named-apk/terminalDebug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- signed release: only when the four keystore secrets exist ----------------------------------------------
      - name: Restore the release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fomo-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fomo-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleFomoRelease assembleTerminalRelease --stacktrace
          cp app/build/outputs/named-apk/fomoRelease/FOMO.apk fomo.apk
          cp app/build/outputs/named-apk/terminalRelease/FOMO-Terminal.apk FOMO-Terminal.apk

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fomo-release-apk
          path: android/fomo.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed release APK (FOMO Terminal)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fomo-terminal-release-apk
          path: android/FOMO-Terminal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the GitHub Release (android-v* tags)
        if: env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/fomo.apk
            android/FOMO-Terminal.apk

      - name: Note when only the debug APK was built
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::Release signing secrets are not set - only the debug APK was built. See android/README.md (keystore section)."

      # Unit tests run last and never block the APK above.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testFomoDebugUnitTest --stacktrace
